# Builds the Docker image and pushes it to Docker Hub every time main changes.
# Needs two repository secrets (GitHub > Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  your Docker Hub user name (ascendrachel)
#   DOCKERHUB_TOKEN     a Docker Hub access token with Read & Write access
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ascendrachel/florida-3pl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
