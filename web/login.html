<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Florida 3PL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f7a4d'/%3E%3Ctext x='16' y='21' font-size='14' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3EF3%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script>try{var t=localStorage.getItem("gt_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 20px; }
  .box { width: min(400px, 100%); }
  .box .brand { margin-bottom: 18px; }
  form { display: grid; gap: 12px; }
</style>
</head>
<body>
<div class="box card">
  <div class="brand"><div class="logo">F3</div><h1 id="title">Florida 3PL</h1></div>
  <p class="muted" id="sub">Sign in with your own login.</p>
  <div id="msg"></div>
  <form id="form">
    <label class="field" id="nameRow" hidden><span>Your name</span><input id="name" autocomplete="name"></label>
    <label class="field"><span>Username</span><input id="user" autocomplete="username" autocapitalize="off" required></label>
    <label class="field"><span id="pwLabel">Password</span><input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" id="go" style="justify-content:center">Sign in</button>
  </form>
</div>
<script>
const $ = (id) => document.getElementById(id);
let setup = false;
const show = (t, cls) => ($("msg").innerHTML = t ? `<div class="banner ${cls || ""}">${t.replace(/</g, "&lt;")}</div>` : "");
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong.");
  return j;
}
(async () => {
  try {
    const s = await (await fetch("/api/setup-needed")).json();
    if (s.setup) {
      if (!s.allowed) { show("The app isn't set up yet. Open it on the server PC to create the first admin.", "bad"); $("form").hidden = true; return; }
      setup = true; document.body.dataset.setup = "1";
      $("title").textContent = "Create the admin account";
      $("sub").textContent = "This is the first start. Pick a name, username and password for yourself. You can add the rest of the team afterwards.";
      $("nameRow").hidden = false; $("go").textContent = "Create account"; $("pw").autocomplete = "new-password";
      $("pwLabel").textContent = "Password (8+ characters)";
    }
  } catch { show("Can't reach the server.", "bad"); }
})();
$("form").addEventListener("submit", async (e) => {
  e.preventDefault(); show(""); $("go").disabled = true;
  try {
    await post(setup ? "/api/setup" : "/api/login", { username: $("user").value, password: $("pw").value, name: $("name").value });
    location.href = "/";
  } catch (err) { show(err.message, "bad"); $("go").disabled = false; }
});
</script>
<script type="module">import { loadBranding } from "/static/js/branding.js"; import { brand } from "/static/js/util.js";
await loadBranding("Sign in · ");
if (!document.body.dataset.setup) document.getElementById("title").textContent = brand.name;</script>
</body>
</html>
